databases:
  - name: divs-development-db
    databaseName: divs_development
    user: divs_development
    plan: free
    region: singapore

services:
  - type: web
    name: divs-development-api
    runtime: python
    plan: free
    region: singapore
    branch: development
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: divs-development-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_TIME_ZONE
        value: Africa/Dar_es_Salaam
