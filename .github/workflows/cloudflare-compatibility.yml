name: Cloudflare compatibility check

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - "frontend/**"
      - ".github/workflows/cloudflare-compatibility.yml"

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out development
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check vinext compatibility
        run: pnpm dlx vinext check
